<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final de estadistica</title>

    <link rel="stylesheet" href="./Style/style.css">
</head>
<body>

    <div id="productos-container">
        <h1>tabla de categorias/productos</h1>

        <div id="lista-de-productos-container">
            <table id="tabla">
                <thead>

                    <tr id="cabecera-de-tabla"></tr>

                </thead>

                <tbody id="datos-de-tabla"></tbody>

            </table>
        </div>
    </div>

    <!-- Graficos -->
    <div id="grafico-circular-contenedor" class="grafico-circular-contenedor">
        <canvas id="grafico-circular"></canvas>
    </div>

    <div id="grafico-dispersion-contenedor" class="grafico-dispersion-contenedor">
        <canvas id="grafico-de-dispersion"></canvas>
    </div>

    <div id="grafico-de-caja-contenedor" class="grafico-de-caja-contenedor">
        <canvas id="grafico-de-caja" ></canvas>
    </div>

    <div id="tabla-estadistica-contenedor">
        <table>
            <tbody id="tabla-estadistica">
                <tr>
                    <td> Media </td>
                    <td id="media-precios"></td>
                </tr>
                <tr>
                    <td> Mediana</td>
                    <td id="mediana-precios"></td>
                </tr>
                <tr>
                    <td> Varianza </td>
                    <td id="varianza-precios"></td>
                </tr>
                <tr>
                    <td> Desvio Estandar </td>
                    <td id="desvio-estandar-precios"></td>
                </tr>
                <tr>
                    <td> Coeficiente de Variacion </td>
                    <td id="coeficiente-de-variacion-precios"></td>
                </tr>
            </tbody>
        </table>

        <table>
            <tbody>
                <tr>
                    <td> Media </td>
                    <td id="media-ventas"></td>
                </tr>
                <tr>
                    <td> Mediana</td>
                    <td id="mediana-ventas"></td>
                </tr>
                <tr>
                    <td> Varianza </td>
                    <td id="varianza-ventas"></td>
                </tr>
                <tr>
                    <td> Desvio Estandar </td>
                    <td id="desvio-estandar-ventas"></td>
                </tr>
                <tr>
                    <td> Coeficiente de Variacion </td>
                    <td id="coeficiente-de-variacion-ventas"></td>
                </tr>
            </tbody>
        </table>

        <table>
            <tbody>
            <tr>
                <td> Covarianza </td>
                <td id="covarianza"></td>
            </tr>
            <tr>
                <td> Coeficiente de Correlacion </td>
                <td id="coeficiente-de-correlacion"></td>
            </tr>
        </tbody>
        </table>
    </div>
    
</body>

<!-- biblioteca para los graficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot"></script> <!-- para el grafico de cajas  -->

<script type="module" src="./Javascript/init.js"></script>



</html>
